# Ultralytics ByteTrack Tracker Configuration
# Optimization for People Counting: Higher track_buffer for occlusion handling.

tracker_type: bytetrack
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.5     # Lowered: keep weak detections as tracks longer
track_buffer: 180          # Increased: remember lost tracks longer for re-association
match_thresh: 0.75         # Lowered: allow slightly looser re-matching after occlusion
fuse_score: True
